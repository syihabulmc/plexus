type: object
required:
  - model
  - prompt
properties:
  model:
    type: string
    minLength: 1
    description: Model identifier, such as dall-e-3.
  prompt:
    type: string
    minLength: 1
    description: Text description of the desired image.
  n:
    type: integer
    minimum: 1
    maximum: 10
    default: 1
    description: Number of images to generate.
  size:
    type: string
    enum:
      - 256x256
      - 512x512
      - 1024x1024
      - 1792x1024
      - 1024x1792
    description: Output dimensions where supported by the target provider.
  response_format:
    type: string
    enum:
      - url
      - b64_json
    default: url
    description: How the image is returned.
  quality:
    type: string
    enum:
      - standard
      - hd
      - high
      - medium
      - low
    description: Legacy OpenAI quality value.
  style:
    type: string
    enum:
      - vivid
      - natural
    description: Legacy OpenAI visual style.
  user:
    type: string
    description: User identifier for content policy tracking.
