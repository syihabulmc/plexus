type: object
properties:
  created:
    type: integer
    description: Unix timestamp when the images were generated.
  data:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        url:
          type: string
          format: uri
        b64_json:
          type: string
        media_type:
          type: string
        revised_prompt:
          type: string
  usage:
    type: object
    properties:
      prompt_tokens:
        type: integer
      completion_tokens:
        type: integer
      total_tokens:
        type: integer
      cost:
        type: number
required:
  - created
  - data
