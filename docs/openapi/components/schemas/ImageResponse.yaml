type: object
properties:
  created:
    type: integer
    description: Unix timestamp when the images were generated.
  data:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        url:
          type: string
          format: uri
        b64_json:
          type: string
        media_type:
          type: string
        revised_prompt:
          type: string
  usage:
    type: object
    properties:
      prompt_tokens:
        type: integer
      completion_tokens:
        type: integer
      total_tokens:
        type: integer
      cost:
        type: number
      input_tokens_details:
        type: object
        additionalProperties: true
        description: >-
          Per-modality input token detail, forwarded as received when the upstream
          reports it (for example `image_tokens`). Omitted by the `/v1/images`
          response, which projects only the flat token counts.
        properties:
          image_tokens:
            type: integer
      output_tokens_details:
        type: object
        additionalProperties: true
        description: >-
          Per-modality output token detail, forwarded as received when the upstream
          reports it (for example `image_tokens`). Omitted by the `/v1/images`
          response, which projects only the flat token counts.
        properties:
          image_tokens:
            type: integer
required:
  - created
  - data
