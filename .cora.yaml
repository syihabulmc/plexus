profile: clean-code

llm:
  temperature: 1
  max_tokens: 32768
  timeout: 300
  cache_ttl: 1440

review:
  sanitize_comments: true
  context_chain:
    enabled: true
    max_context_tokens: 5000
    follow_depth: 1
    include_tests: true
    include_callers: true
    use_brain: true
    impact_depth: 2
    prefer_index: true

focus:
  - security
  - bugs
  - maintainability

ignore:
  files:
    - "**/__tests__/**"
    - "**/*.test.ts"
    - "**/*.spec.ts"
